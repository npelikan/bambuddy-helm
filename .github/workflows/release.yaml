name: Release Chart

# Publishes the chart to GitHub Releases and updates the Helm repo index on the
# gh-pages branch whenever the chart version in Chart.yaml is bumped on main.
#
# This chart lives at the repository root (not under charts/<name>/), so
# helm/chart-releaser-action's automatic packaging cannot discover it. The action
# also crashes in `skip_packaging` mode (`latest_tag: unbound variable`, cr.sh:111
# in v1.6.0/v1.7.0). We therefore drive the chart-releaser (cr) CLI directly:
# package the root chart with `helm package`, then `cr upload` + `cr index`.
#
# One-time setup: enable GitHub Pages for this repo, serving from the `gh-pages`
# branch (Settings -> Pages).

on:
  push:
    branches:
      - main
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'values.schema.json'
      - 'templates/**'
      - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CR_VERSION: v1.7.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install chart-releaser
        run: |
          tarball="chart-releaser_${CR_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/helm/chart-releaser/releases/download/${CR_VERSION}/${tarball}" -o cr.tar.gz
          tar -xzf cr.tar.gz cr
          sudo install -m 0755 cr /usr/local/bin/cr
          rm -f cr cr.tar.gz
          cr version

      - name: Package chart
        run: |
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages
          helm package . --destination .cr-release-packages

      - name: Upload release & update index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          # Create a GitHub Release per chart version, attaching the .tgz.
          # --skip-existing makes this a no-op for versions already released.
          cr upload \
            --owner "$owner" \
            --git-repo "$repo" \
            --commit "$GITHUB_SHA" \
            --skip-existing

          # Regenerate index.yaml from the releases and push it to gh-pages.
          rm -rf .cr-index
          mkdir -p .cr-index
          cr index \
            --owner "$owner" \
            --git-repo "$repo" \
            --push
