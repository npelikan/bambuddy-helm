name: Release Chart

# Publishes the chart to GitHub Releases and updates the Helm repo index on the
# gh-pages branch whenever the chart version in Chart.yaml is bumped on main.
#
# Because this chart lives at the repository root (not under charts/<name>/),
# chart-releaser-action's automatic packaging cannot be used directly. We package
# the root chart ourselves with `helm package` and run the action with
# `skip_packaging: true` so it only handles upload + indexing.
#
# One-time setup: enable GitHub Pages for this repo, serving from the `gh-pages`
# branch (Settings -> Pages). The action creates that branch on first run.

on:
  push:
    branches:
      - main
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'values.schema.json'
      - 'templates/**'
      - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        # chart-releaser (cr) looks for packaged charts in .cr-release-packages
        run: |
          helm package . --destination .cr-release-packages

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
